[project]
name = "market-sentiment-monitor"
version = "0.1.0"
description = "Zero-external-middleware market sentiment monitoring service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "aiohttp>=3.11.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "langgraph>=0.2.0",
    "langchain-deepseek>=0.1.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "aiosqlite>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[project.scripts]
serve = "app.main:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "config"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
